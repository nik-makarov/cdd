name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and publish release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Validate version and package archives
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Expected a stable vX.Y.Z tag, got: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          make dist VERSION="$RELEASE_TAG"
          (cd "dist/$RELEASE_TAG" && sha256sum --check SHA256SUMS)
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$RELEASE_TAG/"*.tar.gz \
            "dist/$RELEASE_TAG/SHA256SUMS" \
            --verify-tag --draft --title "cdd $RELEASE_TAG" \
            --notes-file "dist/$RELEASE_TAG/RELEASE_NOTES.md"
          gh release edit "$RELEASE_TAG" --draft=false
